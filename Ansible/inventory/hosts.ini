# ==================================================
# ANSIBLE INVENTORY FILE
# ==================================================
#
# What is Inventory?
#
# Inventory is the heart of Ansible automation.
# It contains the list of managed devices (hosts),
# groups, and variables used by Ansible to connect
# and perform automation tasks.
#
# ==================================================
# INVENTORY FILE SYNTAX
# ==================================================
#
# 1. GROUP
#
# [group_name]
#
# Example:
#
# [cisco_nxos]
#
#
# 2. HOST
#
# host_alias ansible_host=<ip_address>
#
# Example:
#
# NEXUS01 ansible_host=10.10.10.10
#
#
# 3. GROUP VARIABLES
#
# [all:vars]
#
# Example:
#
# ansible_user=admin
#
#
# 4. CHILD GROUPS
#
# [parent_group:children]
#
# Example:
#
# [cisco:children]
# cisco_ios
# cisco_nxos
#
#
# ==================================================
# INTERVIEW NOTES
# ==================================================
#
# Q: What are the main components of an inventory file?
#
# A:
# 1. Hosts
# 2. Groups
# 3. Variables
# 4. Child Groups
#
#
# Q: What is a Host?
#
# A:
# A managed device such as a router, switch,
# firewall, server, or cloud instance.
#
#
# Q: What is a Group?
#
# A:
# A logical collection of hosts used to organize
# devices based on vendor, operating system,
# location, or function.
#
#
# Q: What is a Child Group?
#
# A:
# A parent group that contains one or more
# groups, allowing hierarchical inventory design.
#
#
# Q: Why use Host Aliases?
#
# A:
# Host aliases make playbooks easier to read
# and manage.
#
# Example:
#
# NEXUS01
#
# instead of
#
# 10.10.10.10
#
#
# Q: Why use Variables in Inventory?
#
# A:
# Variables store connection details and common
# settings so they do not need to be specified
# repeatedly in playbooks.
#
#
# Q: What is [all:vars]?
#
# A:
# Variables defined under [all:vars] are inherited
# by all hosts in the inventory.
#
#
# ==================================================
# PROJECT ENVIRONMENT
# ==================================================
#
# Project:
# Cisco Nexus 9300 Upgrade using Ansible
#
# Design:
# Nexus switches are deployed as a vPC pair
# for High Availability (HA).
#
# Upgrade Strategy:
#
# 1. Verify Nexus Pair Health
# 2. Upgrade NEXUS01
# 3. Validate vPC Status
# 4. Upgrade NEXUS02
# 5. Validate Network Health
#
# This rolling upgrade approach minimizes downtime.
#
# ==================================================

[cisco_nxos]

NEXUS01 ansible_host=10.10.10.10
NEXUS02 ansible_host=10.10.10.11

[cisco_nxos:vars]
# Nexus 9300 Devices
ansible_network_os=cisco.nxos.nxos

[cisco_ios]
IOS01 ansible_host=10.10.20.10
IOS02 ansible_host=10.10.20.11


[cisco_ios:vars]
# Cisco IOS Devices
ansible_network_os=cisco.ios.ios


[vpc_pair]
NEXUS01
NEXUS02


[cisco:children]
cisco_ios
cisco_nxos

[all:vars]

# Connection Method
ansible_connection=network_cli

# Device Credentials
ansible_user=admin

ansible_password=admin