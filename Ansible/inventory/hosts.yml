all:
  children:
    cisco_nxos:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
        ansible_user: admin
        ansible_password: admin
        ansible_command_timeout: 120
        ansible_connect_timeout: 60
        ansible_become: yes
        ansible_become_method: enable
        ansible_become_password: admin
      hosts:
        nexus01:
          ansible_host: 10.10.10.10
        nexus02:
          ansible_host: 10.10.10.11

    # ciscoIOS Group Added
    ciscoIOS:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios          # IOS specific setting
        ansible_user: admin                         # device username
        ansible_password: admin                     # device password
        ansible_command_timeout: 120                # command timeout in seconds
        ansible_connect_timeout: 60                 # connection timeout in seconds
        ansible_become: yes                         # enable privilege mode
        ansible_become_method: enable               # use enable command
        ansible_become_password: admin              # enable password
      hosts:
        R1:
          ansible_host: 192.168.1.1                # replace with actual IP
        R2:
          ansible_host: 192.168.1.2                # replace with actual IP
        R3:
          ansible_host: 192.168.1.3                # replace with actual IP